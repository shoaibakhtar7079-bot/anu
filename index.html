<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>अनु</title>
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--mu:#73726c;--card:#fff;--bd:#e5e3da;--ac:#c96442;--me:#f0eee6}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#f0eee6;--mu:#a09f97;--card:#30302e;--bd:#40403d;--me:#3a3936}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,'Noto Sans Devanagari',sans-serif;padding-top:env(safe-area-inset-top)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header b{font:600 22px Georgia,serif}
header button{font-size:20px;padding:4px 8px}
main{flex:1;overflow:auto;padding:0 16px}
#hi{text-align:center;margin-top:18vh}
#hi h1{font:400 34px Georgia,serif;margin:0}
#hi p{color:var(--mu)}
#chat{max-width:720px;margin:auto}
.u,.a,.e{margin:14px 0;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--me);padding:9px 14px;border-radius:18px;margin-left:auto;width:fit-content;max-width:85%}
.e{color:#c0392b;font-size:14px}
#st{text-align:center;color:var(--mu);font-size:13px;min-height:18px}
footer{padding:4px 12px calc(12px + env(safe-area-inset-bottom))}
#box{max-width:720px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:10px 12px;box-shadow:0 2px 10px #0000000d}
#tx{width:100%;border:0;outline:0;resize:none;background:none;color:inherit;font:inherit;max-height:160px}
#row{display:flex;align-items:center;gap:6px;margin-top:4px}
#row i{flex:1}
#pv{color:var(--mu);font-size:14px}
#mic,#go{width:36px;height:36px;border-radius:50%;font-size:17px;background:var(--me)}
#mic.on{background:#c0392b;color:#fff}
#go{background:var(--ac);color:#fff}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--fg);max-width:420px;width:92%;max-height:85vh}
fieldset{border:1px solid var(--bd);border-radius:10px;margin:8px 0}
dialog input:not([type=checkbox]){display:block;width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit}
.bt{display:flex;gap:8px;margin-top:10px}
.bt button{flex:1;padding:10px;border-radius:10px;background:var(--me)}
#sv{background:var(--ac)!important;color:#fff}
</style>
</head>
<body>
<header><b>अनु</b><span><button id="nw" title="नई बातचीत">✎</button><button id="gr" title="सेटिंग">⚙</button></span></header>
<main id="mn"><div id="hi"><h1>नमस्ते शोएब</h1><p>आज क्या करें?</p></div><div id="chat"></div></main>
<div id="st"></div>
<footer><div id="box">
<textarea id="tx" rows="1" placeholder="अनु से कुछ भी पूछिए"></textarea>
<div id="row"><select id="pv"></select><i></i><button id="mic">🎙</button><button id="go">↑</button></div>
</div></footer>
<dialog id="dg"><h3>सेटिंग</h3><p style="color:var(--mu);font-size:14px">जिसकी चाबी डालेंगे वही चलेगा। चाबियाँ सिर्फ़ इसी ब्राउज़र में रहती हैं। बोलकर सुनने के लिए Groq की चाबी ज़रूरी है।</p><div id="fm"></div><div class="bt"><button id="sv">सेव</button><button id="cl">बंद</button></div></dialog>
<script>
const $=i=>document.getElementById(i),L=localStorage;
const P={
 groq:{n:"Groq (फ्री)",u:"https://api.groq.com/openai/v1",m:"openai/gpt-oss-120b"},
 gemini:{n:"Gemini",u:"https://generativelanguage.googleapis.com/v1beta/openai",m:"gemini-2.5-flash"},
 openai:{n:"ChatGPT",u:"https://api.openai.com/v1",m:"gpt-4o-mini"},
 claude:{n:"Claude",a:1,u:"https://api.anthropic.com/v1/messages",m:"claude-haiku-5-5"},
 router:{n:"OpenRouter",u:"https://openrouter.ai/api/v1",m:"meta-llama/llama-3.3-70b-instruct:free"},
 local:{n:"अपना (Ollama)",u:"http://localhost:11434/v1",m:"llama3.2"}
};
const SYS="तुम अनु हो, शोएब की दोस्त और असिस्टेंट। हमेशा सिर्फ़ हिंदी (देवनागरी) में, ज़्यादा से ज़्यादा दो वाक्य में जवाब दो। अंग्रेज़ी अनुवाद सिर्फ़ तब दो जब साफ़ माँगा जाए। नाम, तारीख़, आँकड़े या तथ्य की पक्की जानकारी न हो तो कहो कि पक्का नहीं पता, गढ़ो मत। बात समझ न आए तो दोबारा पूछो। रिमाइंडर, अलार्म, इंटरनेट खोज, कॉल और मैसेज तुमसे नहीं होते, ऐसा दावा मत करो।";
let cfg=JSON.parse(L.anu_cfg||"{}"),hist=JSON.parse(L.anu_h||"[]");
for(const k in P)cfg[k]=cfg[k]||{};cfg.el=cfg.el||{};
let live=0,spk=0,busy=0,barged=0,ms,ctx,an,rec,voiced=0,lastV=0,noise=.01,loud=0,cool=0,tm,aud;

// ---- स्क्रीन ----
function add(c,t){const d=document.createElement("div");d.className=c;d.textContent=t;$("chat").appendChild(d);$("hi").style.display="none";$("mn").scrollTop=$("mn").scrollHeight}
function ui(){$("mic").classList.toggle("on",!!live);$("st").textContent=spk?"बोल रही हूँ…":busy?"सोच रही हूँ…":live?"सुन रही हूँ…":""}
$("pv").innerHTML=Object.keys(P).map(k=>`<option value="${k}">${P[k].n}</option>`).join("");
$("pv").value=L.anu_p||"groq";
$("pv").onchange=()=>L.anu_p=$("pv").value;
hist.forEach(m=>add(m.role=="user"?"u":"a",m.content));
$("nw").onclick=()=>{hist=[];L.anu_h="[]";$("chat").innerHTML="";$("hi").style.display="block"};

// ---- सेटिंग ----
function form(){
 $("fm").innerHTML=Object.keys(P).map(k=>`<fieldset><legend>${P[k].n}</legend><input data-k="${k}.key" type="password" placeholder="चाबी (API key)"><input data-k="${k}.model" placeholder="${P[k].m}">${k=="local"?`<input data-k="local.url" placeholder="${P.local.u}">`:""}</fieldset>`).join("")
 +`<fieldset><legend>आवाज़ (ElevenLabs, ज़रूरी नहीं)</legend><input data-k="el.key" type="password" placeholder="चाबी"><input data-k="el.voice" placeholder="Voice ID"></fieldset><label><input type="checkbox" id="tk"> बीच में टोकना</label>`;
 document.querySelectorAll("[data-k]").forEach(i=>{const[a,b]=i.dataset.k.split(".");i.value=cfg[a][b]||""});
 $("tk").checked=cfg.tok!==0;
}
$("gr").onclick=()=>{form();$("dg").showModal()};
$("cl").onclick=()=>$("dg").close();
$("sv").onclick=()=>{
 document.querySelectorAll("[data-k]").forEach(i=>{const[a,b]=i.dataset.k.split(".");cfg[a][b]=i.value.replace(/[^\x21-\x7E]/g,"")});
 cfg.tok=$("tk").checked?1:0;L.anu_cfg=JSON.stringify(cfg);$("dg").close();
};

// ---- सोचना: सारे मॉडल एक ही जगह से ----
async function ask(){
 const p=$("pv").value,c=cfg[p],m=c.model||P[p].m;
 if(!c.key&&p!="local")throw Error(P[p].n+" की चाबी ⚙ सेटिंग में डालिए");
 const ms=hist.slice(-20);while(ms[0]&&ms[0].role!="user")ms.shift();
 let r,j;
 if(P[p].a){
  r=await fetch(P[p].u,{method:"POST",headers:{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","content-type":"application/json"},body:JSON.stringify({model:m,max_tokens:1024,system:SYS,messages:ms})});
  j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||r.status);
  return j.content.map(x=>x.text||"").join("");
 }
 const b={model:m,messages:[{role:"system",content:SYS},...ms]};
 if(m.startsWith("openai/gpt-oss"))b.reasoning_effort="low";
 r=await fetch((c.url||P[p].u)+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",...(c.key?{Authorization:"Bearer "+c.key}:{})},body:JSON.stringify(b)});
 j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||r.status);
 return(j.choices[0].message.content||"").replace(/<think>[\s\S]*?<\/think>/g,"").trim();
}
async function send(t,v){
 if(busy||!t)return;busy=1;chup();add("u",t);hist.push({role:"user",content:t});ui();
 let a;
 try{a=await ask()}catch(e){add("e","गड़बड़: "+e.message);hist.pop();busy=0;ui();return}
 hist.push({role:"assistant",content:a});L.anu_h=JSON.stringify(hist.slice(-30));add("a",a);
 if(v||live)await speak(a);
 busy=0;ui();
}
$("go").onclick=()=>{const t=$("tx").value.trim();$("tx").value="";$("tx").style.height="auto";send(t)};
$("tx").onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();$("go").click()}};
$("tx").oninput=()=>{$("tx").style.height="auto";$("tx").style.height=$("tx").scrollHeight+"px"};

// ---- सुनना (Groq Whisper, सिर्फ़ हिंदी) ----
async function stt(b){
 const f=new FormData();
 f.append("file",b,"a."+(b.type.includes("mp4")?"m4a":"webm"));f.append("model","whisper-large-v3-turbo");f.append("language","hi");f.append("response_format","verbose_json");f.append("temperature","0");
 const r=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+cfg.groq.key},body:f});
 const j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||r.status);
 const s=j.segments||[];
 if(s.length){const a=k=>s.reduce((x,y)=>x+(y[k]||0),0)/s.length;if(a("no_speech_prob")>.5||a("avg_logprob")<-1)return""}
 const t=(j.text||"").trim(),d=(t.match(/[\u0900-\u097F]/g)||[]).length;
 return d<2||/सब्सक्राइब|सबटाइटल|subtitle|amara/i.test(t)?"":t;
}
async function heard(b){
 if(busy||!live)return;busy=1;ui();let t="";
 try{t=await stt(b)}catch(e){add("e","सुनने में गड़बड़: "+e.message)}
 busy=0;if(t)send(t,1);else ui();
}

// ---- बोलना ----
async function el(t){
 const r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+cfg.el.voice+"?output_format=mp3_44100_64",{method:"POST",headers:{"xi-api-key":cfg.el.key,"Content-Type":"application/json"},body:JSON.stringify({text:t,model_id:"eleven_flash_v2_5"})});
 if(!r.ok)throw Error("ElevenLabs "+r.status);
 const u=URL.createObjectURL(await r.blob());if(barged)return;
 await new Promise((ok,no)=>{aud=new Audio(u);aud.onended=ok;aud.onerror=no;aud.play().catch(no)});
}
function tts(t){return new Promise(ok=>{if(!window.speechSynthesis)return ok();const u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";u.onend=u.onerror=ok;speechSynthesis.speak(u)})}
async function speak(t){
 spk=1;barged=0;ui();
 try{if(cfg.el.key&&cfg.el.voice)await el(t);else await tts(t)}
 catch(e){if(!barged){add("e","आवाज़: "+e.message);await tts(t)}}
 spk=0;cool=barged?0:performance.now()+800;ui();
}
function chup(){
 if(aud){try{aud.pause();aud.dispatchEvent(new Event("ended"))}catch(e){}}
 if(window.speechSynthesis)speechSynthesis.cancel();
}

// ---- लाइव माइक और बीच में टोकना ----
function lvl(){const b=new Uint8Array(an.fftSize);an.getByteTimeDomainData(b);let s=0;for(const x of b){const v=(x-128)/128;s+=v*v}return Math.sqrt(s/b.length)}
function stopRec(drop){
 const r=rec;rec=null;if(!r)return;
 const keep=!drop&&voiced>=8;
 r.onstop=()=>{if(!keep)return;const b=new Blob(r.ch,{type:r.mimeType});if(b.size>3000)heard(b)};
 try{r.stop()}catch(e){}
}
function tick(){
 const n=performance.now(),v=lvl();
 if(spk){
  if(rec)stopRec(1);
  if(cfg.tok===0){loud=0;return}
  loud=v>Math.max(.07,noise*5)?loud+1:0;
  if(loud>=6){loud=0;barged=1;chup()}
  return;
 }
 if(busy||n<cool){if(rec)stopRec(1);return}
 if(!rec)noise=noise*.98+Math.min(v,.05)*.02;
 if(v>Math.max(.025,noise*3)){
  lastV=n;
  if(!rec){rec=new MediaRecorder(ms);rec.ch=[];rec.ondataavailable=e=>e.data.size&&rec.ch.push(e.data);rec.start();voiced=0}
  voiced++;
 }
 if(rec&&n-lastV>1100)stopRec(0);
}
async function liveOn(){
 if(!cfg.groq.key){add("e","बोलकर सुनने के लिए ⚙ में Groq की चाबी डालिए");return}
 ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
 ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state=="suspended")ctx.resume();
 an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(ms).connect(an);
 live=1;noise=.01;tm=setInterval(tick,50);ui();
}
function liveOff(){live=0;clearInterval(tm);stopRec(1);if(ms)ms.getTracks().forEach(t=>t.stop());ui()}
$("mic").onclick=()=>{
 if(spk){chup();return}
 if(live)liveOff();else liveOn().catch(e=>add("e","माइक: "+e.message));
};
ui();
</script>
</body>
</html>
