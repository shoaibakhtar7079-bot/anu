<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0b45">
<title>अनु</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: #fff; display: flex; flex-direction: column; overflow: hidden;
    height: 100vh; height: 100dvh;
    font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
    background: linear-gradient(-45deg, #1b0b45, #0a2f5c, #4a0c4a, #07423a);
    background-size: 400% 400%; animation: bg 20s ease infinite;
  }
  @keyframes bg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  header { text-align: center; padding: 10px 12px 0; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; background: linear-gradient(90deg, #ff9ad5, #ffd27a, #8ef0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #langBadge { display: inline-block; margin-top: 4px; padding: 3px 12px; font-size: 12px; border-radius: 20px; background: rgba(255,255,255,0.14); }
  #setup { padding: 16px; }
  #setup input { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border-radius: 10px; border: none; font-family: inherit; }
  #setup button { padding: 14px; width: 100%; font-size: 18px; border: none; border-radius: 12px; background: linear-gradient(90deg, #ff4fa3, #8a5cff); color: #fff; font-family: inherit; }
  #main { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #orbwrap { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  #orb { width: min(52vw, 230px); height: min(52vw, 230px); }
  #status { font-size: 14px; opacity: 0.9; margin: 2px 0 4px; min-height: 20px; text-align: center; padding: 0 12px; }
  #media { display: none; padding: 0 12px 4px; text-align: center; }
  #vid, #prev { display: none; max-width: 100%; max-height: 20vh; border-radius: 12px; margin: 0 auto; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 60px; }
  .b { max-width: 86%; padding: 9px 13px; margin: 6px 0; border-radius: 16px; line-height: 1.4; font-size: 15px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); word-wrap: break-word; }
  .me { margin-left: auto; background: rgba(90,160,255,0.28); border-bottom-right-radius: 4px; }
  .anu { margin-right: auto; background: rgba(255,170,90,0.26); border-bottom-left-radius: 4px; }
  .err { color: #ffb3b3; font-size: 13px; margin: 6px 0; }
  .info { text-align: center; color: #cfd; opacity: 0.75; font-size: 13px; margin: 6px 0; }
  #ctl { padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row button { flex: 1; padding: 10px 4px; font-size: 14px; border: none; border-radius: 12px; background: rgba(255,255,255,0.16); color: #fff; font-family: inherit; }
  .row button:disabled { opacity: 0.4; }
  #live { flex: 3 !important; padding: 15px 8px !important; font-size: 18px !important; font-weight: 600; background: linear-gradient(90deg, #ff4fa3, #8a5cff) !important; }
  #live.on { background: linear-gradient(90deg, #14b86b, #0aa0c8) !important; }
  #mute.on { background: #c62828 !important; }
  #txt { flex: 1; min-width: 0; padding: 11px; font-size: 16px; border: none; border-radius: 12px; font-family: inherit; }
  #send { flex: 0 0 auto !important; padding: 10px 18px !important; background: #8a5cff !important; }
  .small button { font-size: 12px !important; background: rgba(0,0,0,0.25) !important; color: #ccc !important; }
</style>
</head>
<body>
<header>
  <h1>अनु</h1>
  <span id="langBadge">🌐 भाषा अपने आप पहचानूँगी</span>
</header>

<div id="setup">
  <p>पहली बार की सेटिंग: अपनी चाबियाँ यहाँ डालिए। ये सिर्फ़ इसी फ़ोन या ब्राउज़र में सेव होंगी।</p>
  <input id="k1" placeholder="Groq की चाबी (gsk_ से शुरू)">
  <input id="k2" placeholder="ElevenLabs की चाबी">
  <input id="k3" placeholder="आवाज़ की ID (Voice ID)">
  <button id="save">सेव करो</button>
</div>

<div id="main">
  <div id="orbwrap">
    <canvas id="orb"></canvas>
    <div id="status"></div>
  </div>
  <div id="media">
    <video id="vid" playsinline muted></video>
    <img id="prev" alt="फ़ोटो">
  </div>
  <div id="chat"></div>
  <div id="ctl">
    <div class="row">
      <button id="live">🎤 बातचीत शुरू करो</button>
      <button id="mute" disabled>🔇 म्यूट</button>
      <button id="chup">🤫 चुप</button>
    </div>
    <div class="row">
      <input id="txt" placeholder="या यहाँ लिखकर पूछिए">
      <button id="send">भेजो</button>
    </div>
    <div class="row">
      <button id="foto">📷 फ़ोटो</button>
      <button id="cam">🎥 कैमरा</button>
      <button id="screen">🖥️ स्क्रीन</button>
      <button id="flip">🔄 पलटो</button>
    </div>
    <div class="row small">
      <button id="bhool">याददाश्त मिटाओ</button>
      <button id="chabi">चाबियाँ बदलो</button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none">
</div>

<script>
const NAAM = "अनु";
const PASAND = ["openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "llama-3.3-70b-versatile"];
const VISION_PASAND = ["qwen/qwen3.8-27b", "qwen/qwen3.6-27b", "meta-llama/llama-4-scout-17b-16e-instruct", "meta-llama/llama-4-maverick-17b-128e-instruct"];
const NAHI = /whisper|tts|guard|orpheus|compound|embed|safeguard|allam/i;
const VISION_RE = /vision|scout|maverick|qwen|vl/i;
const LC = { hindi: "hi-IN", english: "en-IN", tamil: "ta-IN", telugu: "te-IN", bengali: "bn-IN", marathi: "mr-IN", gujarati: "gu-IN", kannada: "kn-IN", malayalam: "ml-IN", punjabi: "pa-IN", urdu: "ur-PK", spanish: "es-ES", french: "fr-FR", german: "de-DE", arabic: "ar-SA", japanese: "ja-JP", korean: "ko-KR", chinese: "zh-CN", russian: "ru-RU", portuguese: "pt-BR", italian: "it-IT", indonesian: "id-ID", turkish: "tr-TR", nepali: "ne-NP", thai: "th-TH", vietnamese: "vi-VN" };
const STATUS = {
  idle: "तैयार। नीचे बटन दबाकर बातचीत शुरू कीजिए",
  listen: "सुन रही हूँ... बोलिए",
  think: "सोच रही हूँ...",
  speak: "अनु बोल रही है...",
  mute: "माइक म्यूट है"
};
const HUE = { idle: 215, listen: 150, think: 45, speak: 320, mute: 0 };

const $ = id => document.getElementById(id);
function saaf(s) { return (s || "").replace(/[^\x21-\x7E]/g, "").replace(/["']/g, ""); }

let GROQ_KEY = saaf(localStorage.getItem("anu_k1"));
let ELEVEN_KEY = saaf(localStorage.getItem("anu_k2"));
let VOICE_ID = saaf(localStorage.getItem("anu_k3"));
let textModels = [], visionModels = [];
let liveOn = false, muted = false, working = false, speaking = false, fake = false;
let micStream = null, inSrc = null, vadTimer = null, rc = null, wl = null, coolUntil = 0;
let stream = null, isScreen = false, facing = "environment";
let pendingPhoto = null, curAudio = null, lastLang = "";
let actx = null, inAn = null, outAn = null;
let noise = 0.01, voiced = 0, lastVoice = 0, recStart = 0;

const MT = (window.MediaRecorder && ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(t => MediaRecorder.isTypeSupported(t))) || "";
const EXT = MT.includes("mp4") ? "m4a" : MT.includes("ogg") ? "ogg" : "webm";

function getCtx() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    inAn = actx.createAnalyser(); inAn.fftSize = 512; inAn.smoothingTimeConstant = 0.5;
    outAn = actx.createAnalyser(); outAn.fftSize = 512; outAn.smoothingTimeConstant = 0.5;
    outAn.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume().catch(() => {});
  return actx;
}

// ---- चाबियाँ ----
const cv = $("orb"), cx = cv.getContext("2d");
function sizeCv() {
  const s = cv.clientWidth, d = window.devicePixelRatio || 1;
  if (!s) return;
  cv.width = s * d; cv.height = s * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", sizeCv);

function dikhao() {
  if (GROQ_KEY && ELEVEN_KEY && VOICE_ID) { $("setup").style.display = "none"; $("main").style.display = "flex"; sizeCv(); }
  else { $("setup").style.display = "block"; $("main").style.display = "none"; }
}
$("save").onclick = () => {
  GROQ_KEY = saaf($("k1").value);
  ELEVEN_KEY = saaf($("k2").value);
  VOICE_ID = saaf($("k3").value);
  localStorage.setItem("anu_k1", GROQ_KEY);
  localStorage.setItem("anu_k2", ELEVEN_KEY);
  localStorage.setItem("anu_k3", VOICE_ID);
  textModels = []; visionModels = [];
  dikhao();
};
$("chabi").onclick = () => {
  stopLive(); chup(); stopStream(); mediaDikhao();
  localStorage.removeItem("anu_k1");
  localStorage.removeItem("anu_k2");
  localStorage.removeItem("anu_k3");
  GROQ_KEY = ""; ELEVEN_KEY = ""; VOICE_ID = ""; textModels = []; visionModels = [];
  dikhao();
};

// ---- याददाश्त ----
let yaadein = JSON.parse(localStorage.getItem("anu_yaadein") || "[]");
let history = JSON.parse(localStorage.getItem("anu_history") || "[]");

function saveSab() {
  localStorage.setItem("anu_yaadein", JSON.stringify(yaadein));
  localStorage.setItem("anu_history", JSON.stringify(history.slice(-30)));
}

function systemMsg() {
  let s = "तुम " + NAAM + " हो, शोएब की दोस्त और पर्सनल असिस्टेंट। दोस्त की तरह अपनेपन से बात करो। जवाब छोटे और सीधे रखो, ज़्यादा से ज़्यादा दो वाक्य। शोएब जिस भाषा में बोले या लिखे, तुम उसी भाषा में जवाब दो। हिंदी हो तो देवनागरी में लिखो, अंग्रेज़ी हो तो अंग्रेज़ी में। सच बोलो: तुम सिर्फ़ बातचीत कर सकती हो, बातें याद रख सकती हो, और जब शोएब तस्वीर या कैमरा दिखाए तब उसे देख सकती हो। तुम रिमाइंडर, अलार्म, शेड्यूल, ख़बरें, ट्रैफ़िक, इंटरनेट खोज, कॉल या मैसेज नहीं कर सकती, और ऐसा कर सकने का दावा कभी मत करो। अगर शोएब ऐसा कुछ माँगे तो साफ़ बता दो कि ये अभी मुझसे नहीं होगा।";
  if (lastLang) s += " शोएब की अभी की भाषा: " + lastLang + "।";
  if (yaadein.length > 0) {
    s += "\n\nशोएब के बारे में तुम्हें ये बातें याद हैं:\n- " + yaadein.join("\n- ");
    s += "\nइन्हें ज़रूरत पड़ने पर स्वाभाविक रूप से इस्तेमाल करो।";
  }
  return { role: "system", content: s };
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = (cls === "me" || cls === "anu") ? "b " + cls : cls;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

history.forEach(m => {
  if (m.role === "user") add("me", m.content);
  else if (m.role === "assistant") add("anu", m.content);
});

$("bhool").onclick = () => {
  if (confirm("अनु की सारी याददाश्त मिटा दूँ?")) {
    localStorage.removeItem("anu_yaadein");
    localStorage.removeItem("anu_history");
    yaadein = []; history = []; $("chat").innerHTML = "";
  }
};

function showLang() {
  if (lastLang) $("langBadge").textContent = "🌐 " + lastLang.charAt(0).toUpperCase() + lastLang.slice(1);
}
function guessLang(t) {
  if (/[\u0900-\u097F]/.test(t)) lastLang = "hindi";
  else if (/^[\x00-\x7F\s]+$/.test(t)) lastLang = "english";
  showLang();
}

// ---- Groq (सोचना) ----
async function modelDhundo() {
  const r = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": "Bearer " + GROQ_KEY } });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = (j.error && j.error.message) ? j.error.message : "अनजान गड़बड़";
    let t = "Groq मॉडल सूची कोड " + r.status + ": " + msg;
    if (r.status === 401 || r.status === 403) t += " (Groq की चाबी ग़लत है या बंद हो गई, नई बनाकर डालिए)";
    throw new Error(t);
  }
  const ids = (j.data || []).map(x => x.id).filter(id => !NAHI.test(id));
  textModels = PASAND.filter(id => ids.includes(id)).concat(ids.filter(id => !PASAND.includes(id)));
  visionModels = VISION_PASAND.filter(id => ids.includes(id)).concat(ids.filter(id => VISION_RE.test(id) && !VISION_PASAND.includes(id)));
  if (!textModels.length) throw new Error("Groq में कोई चालू मॉडल नहीं मिला।");
}

async function groqCall(list, messages, maxTokens, tries) {
  let lastErr = "";
  for (const m of list.slice(0, tries)) {
    const gptoss = m.startsWith("openai/gpt-oss");
    const body = { model: m, messages: messages, max_tokens: gptoss ? maxTokens + 400 : maxTokens };
    if (gptoss) body.reasoning_effort = "low";
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    let txt = (r.ok && j.choices && j.choices[0] && j.choices[0].message) ? (j.choices[0].message.content || "") : "";
    txt = txt.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    if (txt) {
      list.splice(0, list.length, m, ...list.filter(x => x !== m));
      return txt;
    }
    const msg = (j.error && j.error.message) ? j.error.message : "खाली जवाब आया";
    lastErr = "Groq (" + m + ") कोड " + r.status + ": " + msg;
    if (r.status === 401 || r.status === 403) {
      lastErr += " (Groq की चाबी ग़लत है या बंद हो गई, नई बनाकर डालिए)";
      break;
    }
  }
  throw new Error(lastErr || "कोई मॉडल नहीं चला");
}

async function groq(messages, maxTokens) {
  if (!textModels.length) await modelDhundo();
  return await groqCall(textModels, messages, maxTokens, 5);
}

async function dekho(suna, img) {
  if (!visionModels.length && !textModels.length) await modelDhundo();
  if (!visionModels.length) throw new Error("Groq में तस्वीर समझने वाला कोई मॉडल नहीं मिला।");
  const sandarbh = history.slice(-6).map(m => (m.role === "user" ? "शोएब: " : "अनु: ") + m.content).join("\n");
  const prompt = systemMsg().content + "\n\n" + (sandarbh ? "अब तक की बातचीत:\n" + sandarbh + "\n\n" : "") + "शोएब ने ये तस्वीर दिखाकर कहा: " + suna;
  const msgs = [{ role: "user", content: [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: img } }] }];
  return await groqCall(visionModels, msgs, 400, 6);
}

async function yaadKaro(suna, jawab) {
  try {
    const p = "नीचे शोएब और अनु की बातचीत है। अगर शोएब ने अपने बारे में कोई नई ख़ास बात बताई है, जैसे नाम, पसंद, नापसंद, दोस्त, परिवार, काम, योजना या आदत, तो उसे एक छोटे हिंदी वाक्य में लिखो। एक से ज़्यादा हों तो हर एक नई लाइन में। अगर कुछ भी नया नहीं है, तो सिर्फ़ NONE लिखो।\n\nशोएब: " + suna + "\nअनु: " + jawab;
    const out = await groq([{ role: "user", content: p }], 100);
    if (out.trim().toUpperCase().startsWith("NONE")) return;
    out.split("\n").map(x => x.replace(/^[-•\s]+/, "").trim()).filter(x => x.length > 3).forEach(x => {
      if (!yaadein.includes(x)) yaadein.push(x);
    });
    yaadein = yaadein.slice(-60);
    saveSab();
  } catch (e) {}
}

// ---- Groq Whisper (सुनना + भाषा पहचानना) ----
async function transcribe(blob) {
  let lastErr = "";
  for (const m of ["whisper-large-v3-turbo", "whisper-large-v3"]) {
    const fd = new FormData();
    fd.append("file", blob, "audio." + EXT);
    fd.append("model", m);
    fd.append("response_format", "verbose_json");
    fd.append("temperature", "0");
    const r = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + GROQ_KEY },
      body: fd
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.ok) {
      const text = (j.text || "").trim();
      const segs = j.segments || [];
      const nsp = segs.length ? segs.reduce((a, s) => a + (s.no_speech_prob || 0), 0) / segs.length : 0;
      if (!text || nsp > 0.6) return { text: "", lang: "" };
      return { text: text, lang: (j.language || "").toLowerCase() };
    }
    const msg = (j.error && j.error.message) ? j.error.message : "अनजान गड़बड़";
    lastErr = "Whisper (" + m + ") कोड " + r.status + ": " + msg;
    if (r.status === 401 || r.status === 403) { lastErr += " (Groq की चाबी ग़लत है या बंद हो गई)"; break; }
  }
  throw new Error(lastErr);
}

// ---- आवाज़ (ElevenLabs) ----
async function elevenBolo(text) {
  const r = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "?output_format=mp3_44100_64", {
    method: "POST",
    headers: { "xi-api-key": ELEVEN_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ text: text, model_id: "eleven_flash_v2_5" })
  });
  if (!r.ok) {
    let t = "";
    try {
      const j = await r.json();
      t = (j.detail && j.detail.message) ? j.detail.message : JSON.stringify(j);
    } catch (e) {}
    throw new Error("ElevenLabs कोड " + r.status + ": " + t);
  }
  const url = URL.createObjectURL(await r.blob());
  const c = getCtx();
  if (c.state === "suspended") { try { await c.resume(); } catch (e) {} }
  await new Promise((res, rej) => {
    const a = new Audio(url);
    curAudio = a;
    try { const s = c.createMediaElementSource(a); s.connect(outAn); } catch (e) {}
    a.onended = () => { curAudio = null; res(); };
    a.onerror = () => { curAudio = null; rej(new Error("आवाज़ चल नहीं पाई")); };
    a.play().catch(e => { curAudio = null; rej(e); });
  });
}

function browserBolo(text) {
  return new Promise(res => {
    if (!window.speechSynthesis) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LC[lastLang] || "hi-IN";
    fake = true;
    u.onend = () => { fake = false; res(); };
    u.onerror = () => { fake = false; res(); };
    speechSynthesis.speak(u);
  });
}

async function bolo(text) {
  speaking = true; uiUpdate();
  try { await elevenBolo(text); }
  catch (err) {
    add("err", "आवाज़ में गड़बड़: " + err.message + " (अभी फ़ोन की अपनी आवाज़ से बोल रही हूँ)");
    await browserBolo(text);
  }
  speaking = false;
  coolUntil = performance.now() + 800;
  uiUpdate();
}

function chup() {
  if (curAudio) { try { curAudio.pause(); curAudio.dispatchEvent(new Event("ended")); } catch (e) {} }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
$("chup").onclick = chup;

// ---- मुख्य सवाल-जवाब ----
async function core(suna, langName) {
  if (langName) { lastLang = langName; showLang(); }
  const img = pendingPhoto || frameLo();
  const usedPhoto = !!pendingPhoto;
  add("me", suna + (img ? "  📷" : ""));
  let jawab = "";
  try {
    if (img) jawab = await dekho(suna, img);
    else jawab = await groq([systemMsg()].concat(history.slice(-20), [{ role: "user", content: suna }]), 220);
    history.push({ role: "user", content: (img ? "(तस्वीर के साथ) " : "") + suna });
    history.push({ role: "assistant", content: jawab });
    saveSab();
  } catch (err) {
    add("err", "गड़बड़: " + err.message);
    working = false; uiUpdate();
    return;
  }
  if (usedPhoto) { pendingPhoto = null; mediaDikhao(); }
  add("anu", jawab);
  await bolo(jawab);
  yaadKaro(suna, jawab);
  working = false; uiUpdate();
}

function bhejo() {
  const t = $("txt").value.trim();
  if (!t || working) return;
  $("txt").value = "";
  getCtx();
  working = true; uiUpdate();
  guessLang(t);
  core(t, "");
}
$("send").onclick = bhejo;
$("txt").onkeydown = e => { if (e.key === "Enter") bhejo(); };

// ---- लाइव सुनना: आवाज़ पकड़ना ----
function inLevel() {
  if (!inAn) return 0;
  const b = new Uint8Array(inAn.fftSize);
  inAn.getByteTimeDomainData(b);
  let s = 0;
  for (let i = 0; i < b.length; i++) { const v = (b[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / b.length);
}

function startRec() {
  const arr = [];
  voiced = 0; recStart = performance.now(); lastVoice = recStart;
  rc = new MediaRecorder(micStream, MT ? { mimeType: MT } : undefined);
  rc.arr = arr;
  rc.ondataavailable = e => { if (e.data && e.data.size) arr.push(e.data); };
  rc.start();
}

function finishRec(discard) {
  const r = rc;
  rc = null;
  if (!r) return;
  const keep = !discard && voiced >= 5;
  r.onstop = () => {
    if (!keep) return;
    const blob = new Blob(r.arr, { type: MT || "audio/webm" });
    if (blob.size < 2000) return;
    suniHui(blob);
  };
  try { r.stop(); } catch (e) {}
}

async function suniHui(blob) {
  if (working || !liveOn) return;
  working = true; uiUpdate();
  let tr;
  try { tr = await transcribe(blob); }
  catch (e) { add("err", "सुनने में गड़बड़: " + e.message); working = false; uiUpdate(); return; }
  if (!tr.text) { working = false; uiUpdate(); return; }
  core(tr.text, tr.lang);
}

function vadTick() {
  const now = performance.now();
  if (!liveOn || muted || working || speaking || now < coolUntil) {
    if (rc) finishRec(true);
    return;
  }
  const lvl = inLevel();
  if (!rc) noise = noise * 0.98 + Math.min(lvl, 0.05) * 0.02;
  const th = Math.max(0.02, noise * 2.5);
  if (lvl > th) {
    lastVoice = now;
    if (!rc) startRec();
    voiced++;
  }
  if (rc && now - lastVoice > 1200) finishRec(false);
  else if (rc && now - recStart > 25000) finishRec(false);
}

async function startLive() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    add("err", "इस ब्राउज़र में माइक रिकॉर्डिंग नहीं चलती। Chrome इस्तेमाल कीजिए।");
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    add("err", "माइक नहीं मिला: " + e.message + " (ब्राउज़र में माइक की अनुमति दीजिए)");
    return;
  }
  const c = getCtx();
  inSrc = c.createMediaStreamSource(micStream);
  inSrc.connect(inAn);
  liveOn = true; muted = false; noise = 0.01;
  try { if (navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch (e) {}
  vadTimer = setInterval(vadTick, 50);
  uiUpdate();
}

function stopLive() {
  liveOn = false; muted = false;
  if (vadTimer) { clearInterval(vadTimer); vadTimer = null; }
  finishRec(true);
  if (inSrc) { try { inSrc.disconnect(); } catch (e) {} inSrc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (wl) { wl.release().catch(() => {}); wl = null; }
  uiUpdate();
}

$("live").onclick = () => { if (liveOn) { stopLive(); chup(); } else startLive(); };
$("mute").onclick = () => {
  if (!liveOn || !micStream) return;
  muted = !muted;
  micStream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  if (muted) finishRec(true);
  uiUpdate();
};

function uiUpdate() {
  $("live").classList.toggle("on", liveOn);
  $("live").textContent = liveOn ? "⏹ बातचीत बंद करो" : "🎤 बातचीत शुरू करो";
  $("mute").disabled = !liveOn;
  $("mute").classList.toggle("on", muted);
  $("mute").textContent = muted ? "🎙️ अनम्यूट" : "🔇 म्यूट";
}

// ---- गोला और लहरें ----
function curMode() {
  if (speaking) return "speak";
  if (working) return "think";
  if (liveOn && muted) return "mute";
  if (liveOn) return "listen";
  return "idle";
}
const N = 48;
const sm = new Array(N).fill(0);
let hue = 215, lastMode = "";

function frame(t) {
  requestAnimationFrame(frame);
  const S = cv.clientWidth;
  if (!S) return;
  if (cv.width < S) sizeCv();
  const mode = curMode();
  if (mode !== lastMode) { lastMode = mode; $("status").textContent = STATUS[mode]; }
  let d = null;
  if (mode === "speak" && !fake && outAn) { d = new Uint8Array(outAn.frequencyBinCount); outAn.getByteFrequencyData(d); }
  else if (mode === "listen" && inAn) { d = new Uint8Array(inAn.frequencyBinCount); inAn.getByteFrequencyData(d); }
  let sum = 0;
  for (let i = 0; i < N; i++) {
    const j = i < N / 2 ? i : N - 1 - i;
    let v;
    if (d) { const k = 2 + Math.floor(j / (N / 2) * 40); v = Math.min(1, Math.pow(d[k] / 255, 0.8) * 1.4); }
    else if (mode === "speak") v = 0.25 + 0.45 * Math.abs(Math.sin(t / 130 + i * 0.9));
    else if (mode === "think") v = 0.18 + 0.18 * Math.sin(t / 180 + i * 0.7);
    else if (mode === "mute") v = 0.05;
    else v = 0.12 + 0.08 * Math.sin(t / 500 + i * 0.5);
    sm[i] += (v - sm[i]) * 0.35;
    sum += sm[i];
  }
  const avg = sum / N;
  hue += (HUE[mode] - hue) * 0.06;
  cx.clearRect(0, 0, S, S);
  const c = S / 2, R = S * 0.17 * (0.9 + avg * 0.4);
  const dim = mode === "mute";
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 - Math.PI / 2;
    const r1 = R + S * 0.03, r2 = r1 + S * 0.02 + sm[i] * S * 0.2;
    cx.strokeStyle = "hsl(" + ((hue + i * 3) % 360) + "," + (dim ? 30 : 90) + "%," + (dim ? 45 : 62) + "%)";
    cx.lineWidth = S * 0.018; cx.lineCap = "round";
    cx.beginPath();
    cx.moveTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1);
    cx.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
    cx.stroke();
  }
  const g = cx.createRadialGradient(c - R * 0.3, c - R * 0.3, R * 0.1, c, c, R);
  g.addColorStop(0, "hsl(" + hue + ",95%,75%)");
  g.addColorStop(1, "hsl(" + ((hue + 50) % 360) + ",90%,45%)");
  cx.shadowColor = "hsl(" + hue + ",100%,60%)";
  cx.shadowBlur = S * 0.12;
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(c, c, R, 0, Math.PI * 2); cx.fill();
  cx.shadowBlur = 0;
}

// ---- फ़ोटो, कैमरा, स्क्रीन ----
function mediaDikhao() {
  $("vid").style.display = stream ? "block" : "none";
  $("prev").style.display = pendingPhoto ? "block" : "none";
  $("media").style.display = (stream || pendingPhoto) ? "block" : "none";
  $("cam").textContent = (stream && !isScreen) ? "⏹ कैमरा" : "🎥 कैमरा";
  $("screen").textContent = (stream && isScreen) ? "⏹ स्क्रीन" : "🖥️ स्क्रीन";
}

function stopStream() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); }
  stream = null; isScreen = false;
  $("vid").srcObject = null;
}

function frameLo() {
  const v = $("vid");
  if (!stream || !v.videoWidth) return null;
  const s = Math.min(1, 768 / Math.max(v.videoWidth, v.videoHeight));
  const cc = document.createElement("canvas");
  cc.width = Math.round(v.videoWidth * s);
  cc.height = Math.round(v.videoHeight * s);
  cc.getContext("2d").drawImage(v, 0, 0, cc.width, cc.height);
  return cc.toDataURL("image/jpeg", 0.7);
}

async function startCamera() {
  stopStream();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    add("err", "इस ब्राउज़र में कैमरा नहीं चलता।"); mediaDikhao(); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    isScreen = false;
    $("vid").srcObject = stream;
    await $("vid").play();
    add("info", "कैमरा चालू है। अब आप जो भी पूछेंगे, अनु उस पल की तस्वीर देखकर जवाब देगी।");
  } catch (e) {
    stream = null;
    add("err", "कैमरा नहीं खुला: " + e.message);
  }
  mediaDikhao();
}

async function startScreen() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    add("err", "इस ब्राउज़र में स्क्रीन शेयर नहीं चलता। फ़ोन के Chrome में अक्सर नहीं मिलता, लैपटॉप पर चलेगा।");
    return;
  }
  stopStream();
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    isScreen = true;
    $("vid").srcObject = stream;
    await $("vid").play();
    stream.getVideoTracks()[0].onended = () => { stopStream(); mediaDikhao(); };
    add("info", "स्क्रीन शेयर चालू है। अब आप जो भी पूछेंगे, अनु आपकी स्क्रीन की उस पल की तस्वीर देखेगी।");
  } catch (e) {
    stream = null;
    add("err", "स्क्रीन शेयर नहीं हुआ: " + e.message);
  }
  mediaDikhao();
}

$("cam").onclick = () => { if (stream && !isScreen) { stopStream(); mediaDikhao(); } else startCamera(); };
$("screen").onclick = () => { if (stream && isScreen) { stopStream(); mediaDikhao(); } else startScreen(); };
$("flip").onclick = () => {
  facing = facing === "environment" ? "user" : "environment";
  if (stream && !isScreen) startCamera();
  else add("info", "पहले कैमरा चालू कीजिए।");
};

$("foto").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1024 / Math.max(im.width, im.height));
      const cc = document.createElement("canvas");
      cc.width = Math.round(im.width * s);
      cc.height = Math.round(im.height * s);
      cc.getContext("2d").drawImage(im, 0, 0, cc.width, cc.height);
      pendingPhoto = cc.toDataURL("image/jpeg", 0.8);
      $("prev").src = pendingPhoto;
      mediaDikhao();
      add("info", "फ़ोटो जुड़ गई। अब बोलकर या लिखकर पूछिए। हटाने के लिए फ़ोटो पर दबाइए।");
    };
    im.onerror = () => add("err", "ये फ़ोटो खुल नहीं पाई।");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
  $("file").value = "";
};
$("prev").onclick = () => { pendingPhoto = null; mediaDikhao(); };

dikhao();
uiUpdate();
mediaDikhao();
requestAnimationFrame(frame);
</script>
