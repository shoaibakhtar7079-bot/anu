<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अनु</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  h1 { text-align: center; margin: 12px 0 0; }
  #setup { padding: 16px; }
  #setup input { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; font-size: 16px; border-radius: 8px; border: none; }
  #setup button { padding: 14px; width: 100%; font-size: 18px; border: none; border-radius: 10px; background: #e91e63; color: #fff; }
  #main { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .me { text-align: right; color: #8ab4ff; margin: 8px 0; }
  .anu { text-align: left; color: #ffd28a; margin: 8px 0; }
  .err { text-align: left; color: #ff7b7b; margin: 8px 0; font-size: 14px; }
  #btn { margin: 12px; padding: 18px; font-size: 20px; border: none; border-radius: 14px; background: #e91e63; color: #fff; }
  .chhota { margin: 0 12px 12px; padding: 8px; font-size: 14px; border: none; border-radius: 10px; background: #333; color: #aaa; }
</style>
</head>
<body>
<h1>अनु</h1>

<div id="setup">
  <p>पहली बार की सेटिंग: अपनी चाबियाँ यहाँ डालिए। ये सिर्फ़ इसी फ़ोन या ब्राउज़र में सेव होंगी।</p>
  <input id="k1" placeholder="Groq की चाबी (gsk_ से शुरू)">
  <input id="k2" placeholder="ElevenLabs की चाबी">
  <input id="k3" placeholder="आवाज़ की ID (Voice ID)">
  <button id="save">सेव करो</button>
</div>

<div id="main">
  <div id="chat"></div>
  <button id="btn">बोलिए</button>
  <button class="chhota" id="bhool">सारी याददाश्त मिटाओ</button>
  <button class="chhota" id="chabi">चाबियाँ बदलो</button>
</div>

<script>
const NAAM = "अनु";
const PASAND = ["openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.1-8b-instant", "llama-3.3-70b-versatile"];
const NAHI = /whisper|tts|guard|orpheus|compound|embed|safeguard|allam/i;

function saaf(s) { return (s || "").replace(/[^\x21-\x7E]/g, "").replace(/["']/g, ""); }

let GROQ_KEY = saaf(localStorage.getItem("anu_k1"));
let ELEVEN_KEY = saaf(localStorage.getItem("anu_k2"));
let VOICE_ID = saaf(localStorage.getItem("anu_k3"));
let modelList = [];

const setup = document.getElementById("setup");
const main = document.getElementById("main");
const chat = document.getElementById("chat");
const btn = document.getElementById("btn");

function dikhao() {
  if (GROQ_KEY && ELEVEN_KEY && VOICE_ID) { setup.style.display = "none"; main.style.display = "flex"; }
  else { setup.style.display = "block"; main.style.display = "none"; }
}

document.getElementById("save").onclick = () => {
  GROQ_KEY = saaf(document.getElementById("k1").value);
  ELEVEN_KEY = saaf(document.getElementById("k2").value);
  VOICE_ID = saaf(document.getElementById("k3").value);
  localStorage.setItem("anu_k1", GROQ_KEY);
  localStorage.setItem("anu_k2", ELEVEN_KEY);
  localStorage.setItem("anu_k3", VOICE_ID);
  modelList = [];
  dikhao();
};

document.getElementById("chabi").onclick = () => {
  localStorage.removeItem("anu_k1");
  localStorage.removeItem("anu_k2");
  localStorage.removeItem("anu_k3");
  GROQ_KEY = ""; ELEVEN_KEY = ""; VOICE_ID = ""; modelList = [];
  dikhao();
};
dikhao();

// ---- याददाश्त ----
let yaadein = JSON.parse(localStorage.getItem("anu_yaadein") || "[]");
let history = JSON.parse(localStorage.getItem("anu_history") || "[]");

function saveSab() {
  localStorage.setItem("anu_yaadein", JSON.stringify(yaadein));
  localStorage.setItem("anu_history", JSON.stringify(history.slice(-30)));
}

function systemMsg() {
  let s = "तुम " + NAAM + " हो, शोएब की दोस्त और पर्सनल असिस्टेंट। दोस्त की तरह अपनेपन से बात करो। हमेशा हिंदी में, छोटे और सीधे जवाब दो, ज़्यादा से ज़्यादा दो वाक्य।";
  if (yaadein.length > 0) {
    s += "\n\nशोएब के बारे में तुम्हें ये बातें याद हैं:\n- " + yaadein.join("\n- ");
    s += "\nइन्हें ज़रूरत पड़ने पर स्वाभाविक रूप से इस्तेमाल करो।";
  }
  return { role: "system", content: s };
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

history.forEach(m => {
  if (m.role === "user") add("me", m.content);
  else if (m.role === "assistant") add("anu", m.content);
});

// ---- Groq: चालू मॉडलों की सूची अपने आप निकालना ----
async function modelDhundo() {
  const r = await fetch("https://api.groq.com/openai/v1/models", {
    headers: { "Authorization": "Bearer " + GROQ_KEY }
  });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = (j.error && j.error.message) ? j.error.message : "अनजान गड़बड़";
    let t = "Groq मॉडल सूची कोड " + r.status + ": " + msg;
    if (r.status === 401 || r.status === 403) t += " (Groq की चाबी ग़लत है या बंद हो गई, नई बनाकर डालिए)";
    throw new Error(t);
  }
  const ids = (j.data || []).map(x => x.id).filter(id => !NAHI.test(id));
  const pehle = PASAND.filter(id => ids.includes(id));
  const baaki = ids.filter(id => !PASAND.includes(id));
  modelList = pehle.concat(baaki);
  if (modelList.length === 0) throw new Error("Groq में कोई चालू मॉडल नहीं मिला।");
}

async function groq(messages, maxTokens) {
  if (modelList.length === 0) await modelDhundo();
  let lastErr = "";
  for (const m of modelList.slice(0, 5)) {
    const gptoss = m.startsWith("openai/gpt-oss");
    const body = { model: m, messages: messages, max_tokens: gptoss ? maxTokens + 400 : maxTokens };
    if (gptoss) body.reasoning_effort = "low";
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    const txt = (r.ok && j.choices && j.choices[0] && j.choices[0].message) ? j.choices[0].message.content : "";
    if (txt && txt.trim()) {
      modelList = [m].concat(modelList.filter(x => x !== m));
      return txt.trim();
    }
    const msg = (j.error && j.error.message) ? j.error.message : "खाली जवाब आया";
    lastErr = "Groq (" + m + ") कोड " + r.status + ": " + msg;
    if (r.status === 401 || r.status === 403) {
      lastErr += " (Groq की चाबी ग़लत है या बंद हो गई, नई बनाकर डालिए)";
      break;
    }
  }
  throw new Error(lastErr);
}

async function socho(text) {
  history.push({ role: "user", content: text });
  try {
    const jawab = await groq([systemMsg()].concat(history.slice(-20)), 150);
    history.push({ role: "assistant", content: jawab });
    saveSab();
    return jawab;
  } catch (e) {
    history.pop();
    throw e;
  }
}

async function yaadKaro(suna, jawab) {
  try {
    const p = "नीचे शोएब और अनु की बातचीत है। अगर शोएब ने अपने बारे में कोई नई ख़ास बात बताई है, जैसे नाम, पसंद, नापसंद, दोस्त, परिवार, काम, योजना या आदत, तो उसे एक छोटे हिंदी वाक्य में लिखो। एक से ज़्यादा हों तो हर एक नई लाइन में। अगर कुछ भी नया नहीं है, तो सिर्फ़ NONE लिखो।\n\nशोएब: " + suna + "\nअनु: " + jawab;
    const out = await groq([{ role: "user", content: p }], 100);
    if (out.trim().toUpperCase().startsWith("NONE")) return;
    out.split("\n").map(x => x.replace(/^[-•\s]+/, "").trim()).filter(x => x.length > 3).forEach(x => {
      if (!yaadein.includes(x)) yaadein.push(x);
    });
    yaadein = yaadein.slice(-60);
    saveSab();
  } catch (e) {}
}

// ---- ElevenLabs: आवाज़ ----
async function bolo(text) {
  const r = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID + "?output_format=mp3_44100_64", {
    method: "POST",
    headers: { "xi-api-key": ELEVEN_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ text: text, model_id: "eleven_flash_v2_5" })
  });
  if (!r.ok) {
    let t = "";
    try {
      const j = await r.json();
      t = (j.detail && j.detail.message) ? j.detail.message : JSON.stringify(j);
    } catch (e) {}
    throw new Error("ElevenLabs कोड " + r.status + ": " + t);
  }
  const blob = await r.blob();
  const audio = new Audio(URL.createObjectURL(blob));
  await audio.play();
}

// ---- सुनना ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  add("err", "इस ब्राउज़र में बोलकर सुनने की सुविधा नहीं है। Chrome इस्तेमाल कीजिए।");
} else {
  const rec = new SR();
  rec.lang = "hi-IN";

  rec.onresult = async (e) => {
    const suna = e.results[0][0].transcript;
    add("me", suna);
    btn.textContent = "सोच रही हूँ...";
    let jawab = "";
    try {
      jawab = await socho(suna);
      add("anu", jawab);
    } catch (err) {
      add("err", "गड़बड़: " + err.message);
      btn.textContent = "बोलिए";
      return;
    }
    try {
      await bolo(jawab);
    } catch (err) {
      add("err", "आवाज़ में गड़बड़: " + err.message);
    }
    yaadKaro(suna, jawab);
    btn.textContent = "बोलिए";
  };

  rec.onerror = () => { btn.textContent = "बोलिए"; };
  rec.onend = () => { if (btn.textContent === "सुन रही हूँ...") btn.textContent = "बोलिए"; };
  btn.onclick = () => {
    btn.textContent = "सुन रही हूँ...";
    try { rec.start(); } catch (e) { btn.textContent = "बोलिए"; }
  };
}

document.getElementById("bhool").onclick = () => {
  if (confirm("अनु की सारी याददाश्त मिटा दूँ?")) {
    localStorage.removeItem("anu_yaadein");
    localStorage.removeItem("anu_history");
    yaadein = []; history = []; chat.innerHTML = "";
  }
};
</script>
</body>
</html>
